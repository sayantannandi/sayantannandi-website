name: Validate static site
on:
  push:
    branches: [codex/step-up-funnel-rebuild]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate static pages
        run: python3 scripts/build_site.py
      - name: Check generated files match their sources
        run: git diff --exit-code
      - name: Validate routes, checkout links and customer pages
        run: python3 scripts/validate_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA-only DOM dependency
        run: npm install --no-save --package-lock=false linkedom@0.18.12
      - name: Test lead-magnet scoring and report capture
        run: node scripts/test_lead_magnets.mjs
      - name: Test existing practice resources and newsletter
        run: node scripts/test_interactions.mjs
      - name: Check interactive JavaScript syntax
        run: |
          node --input-type=module --check < assets/skills-check.js
          node --input-type=module --check < assets/step-up.js
          node --input-type=module --check < assets/lead-magnets.js
