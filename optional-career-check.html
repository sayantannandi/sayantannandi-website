<style>
  /* Layout idea: one narrow reading column, one question per screen, result as a short report. */
  :root {
    color-scheme: light;
    --navy: #102C50;
    --blue: #2854DF;
    --paper: #FFFFFF;
    --panel: #F2F5FA;
    --ink: #1B2433;
    --muted: #586478;
    --line: #D9E0EB;
    --weak: #B3422B;
    --display: Georgia, "Times New Roman", serif;
    --body: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--body); font-size: 17px; line-height: 1.55; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 28px 20px 64px; display: flex; flex-direction: column; gap: 22px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .brand { font-family: var(--display); color: var(--navy); font-size: 17px; }
  .pill { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--navy); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  h1, h2, h3 { font-family: var(--display); color: var(--navy); text-wrap: balance; margin: 0; line-height: 1.2; }
  h1 { font-size: 38px; }
  h2 { font-size: 25px; }
  h3 { font-size: 19px; }
  p { margin: 0; max-width: 62ch; }
  .muted { color: var(--muted); }
  .small { font-size: 14.5px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .stack-lg { display: flex; flex-direction: column; gap: 26px; }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: 12px 22px; font-weight: 700; align-self: flex-start; }
  .btn:hover { background: #1f45c0; }
  .btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); font-weight: 400; }
  .btn.ghost:hover { background: var(--panel); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; align-self: flex-start; font-size: 14.5px; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--panel); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--navy); }
  .tag { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); font-weight: 700; }
  .qtext { font-family: var(--display); font-size: 21px; color: var(--navy); line-height: 1.35; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { text-align: left; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; line-height: 1.45; }
  .opt:hover { border-color: var(--blue); background: var(--panel); }
  .opt[aria-pressed="true"] { border-color: var(--navy); background: var(--panel); box-shadow: inset 4px 0 0 var(--navy); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .score { display: flex; align-items: baseline; gap: 10px; font-family: var(--display); color: var(--navy); }
  .score b { font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
  .score span { font-size: 20px; color: var(--muted); }
  .areas { display: flex; flex-direction: column; gap: 10px; }
  .area { display: grid; grid-template-columns: minmax(0, 1fr) 120px 34px; gap: 12px; align-items: center; font-size: 15.5px; }
  .area .meter { height: 10px; background: var(--panel); border-radius: 5px; overflow: hidden; }
  .area .meter i { display: block; height: 100%; background: var(--navy); }
  .area .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .area.low .name { color: var(--weak); font-weight: 700; }
  .area.low .meter i { background: var(--weak); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  .try { border-left: 4px solid var(--blue); padding-left: 14px; }
  input[type="email"] { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; flex: 1 1 220px; }
  details { border-top: 1px solid var(--line); padding-top: 14px; }
  summary { cursor: pointer; color: var(--navy); font-weight: 700; }
  .key { display: flex; flex-direction: column; gap: 18px; margin-top: 16px; }
  .key ol { margin: 6px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
  .key li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
  .key li b { font-variant-numeric: tabular-nums; color: var(--muted); }
  .key li.best { color: var(--navy); font-weight: 700; }
  .key li.best b { color: var(--blue); }
  .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .num2 { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .num2 b { font-family: var(--display); font-size: 44px; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
  .num2 span { font-size: 14.5px; color: var(--muted); }
  .grid4 { display: grid; grid-template-columns: 26px minmax(0,1fr) minmax(0,1fr); grid-template-rows: auto auto 22px; gap: 6px; font-size: 14px; }
  .grid4 .cell { border: 1px solid var(--line); border-radius: 8px; padding: 14px 10px; text-align: center; color: var(--muted); background: var(--paper); min-height: 64px; display: flex; align-items: center; justify-content: center; }
  .grid4 .cell.on { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 700; }
  .grid4 .ax { font-size: 12px; color: var(--muted); text-align: center; }
  .grid4 .ay { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; color: var(--muted); text-align: center; grid-row: 1 / span 2; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-weight: 700; color: var(--navy); }
  .rupee { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; max-width: 320px; background: #fff; }
  .rupee span { padding-left: 12px; color: var(--muted); }
  .rupee input { font: inherit; border: 0; padding: 12px 12px 12px 6px; width: 100%; min-width: 0; background: transparent; font-variant-numeric: tabular-nums; }
  .rupee input:focus-visible { outline: none; }
  .rupee:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
  .err { font-size: 14px; color: var(--weak); }
  .err:empty { display: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
  @media (max-width: 440px) {
    h1 { font-size: 30px; }
    .area { grid-template-columns: minmax(0, 1fr) 70px 30px; }
    .score b { font-size: 46px; }
  }
  #send-result .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #send-result label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; color: var(--navy); font-size: 15px; }
  #send-result label.small { flex-direction: row; gap: 8px; font-weight: 400; color: var(--muted); }
  #send-result input[name=name], #send-result input[name=email] { font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #D9E0EB; border-radius: 6px; width: 100%; max-width: none; flex: none; height: auto; }
  @media (max-width: 560px) { #send-result .frow { grid-template-columns: 1fr; } }
</style>
</head>

<div class="wrap">

  <h1 style="position:absolute;left:-9999px">The Optional Career Check</h1>
  <main id="app" class="stack-lg"></main>
  <p class="small muted" style="margin-top:40px">I am not a SEBI registered investment adviser, and I do not give investment advice on any particular asset. Everything here is education. Your answers stay in your browser. <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
</div>

<script>
var AREAS = [
  { id: "A", name: "Explaining your work", week: 1,
    low: "Your updates describe effort, and the reader has to work out why it matters. Most will not.",
    tryIt: "Rewrite the first sentence of your next update as: [Name or team] can now do [thing], which they could not do before. If you cannot name who, that is the finding." },
  { id: "B", name: "Deciding without certainty", week: 2,
    low: "You pass decisions upward as a list of options. That feels careful. To the person receiving it, the decision has barely started.",
    tryIt: "Send one recommendation with a number on it. I recommend A. I am about 70 percent sure. I would change my mind if..." },
  { id: "C", name: "Being read by busy people", week: 3,
    low: "Your point is in the document, in the middle of page two. A forwarded note gets ten seconds from someone who has never met you.",
    tryIt: "Move the decision or finding to line one. Then ask your manager what worries them most this quarter, and write down the answer." },
  { id: "D", name: "Getting agreement across teams", week: 4,
    low: "You make a good case and still do not get the help. The other team hears a cost for them and a benefit for you.",
    tryIt: "Before your next request, find one thing that team has asked you for and deliver it. Or cut your request to a third of its size and ask for that." },
  { id: "E", name: "Working through people and AI", week: 5,
    low: "Work comes back to you needing rework, so you end up doing it twice. Much of that started in the handoff.",
    tryIt: "Write four lines for your next handoff. The result. The date. What they decide alone. When you will review it together. For anything drafted with AI, mark which claims you checked yourself." },
  { id: "F", name: "Showing you are ready", week: 6,
    low: "Your case for a bigger role rests on time served and work delivered. Both are true. Neither tells your manager what you would do with more.",
    tryIt: "Write down one thing from the last six months that sat outside your job, and the name of a person who would confirm it happened." }
];

var QUESTIONS = [
  { area: 0, isCase: true,
    q: "You run a ten-person data team. This quarter you moved the daily sales report from 11 a.m. to 7 a.m. Your director wants two lines for her review with the head of sales. Which do you send?",
    why: "It names who can now do what, and someone who can confirm it.",
    opts: [
      ["“Migrated the sales pipeline to the new scheduler. Run time down 62 percent. Zero failed runs in nine weeks.”", 1],
      ["“Sales data now arrives four hours earlier, which supports faster and better decisions across the commercial teams.”", 2],
      ["“The team worked through two release weekends to deliver the report four hours earlier than before.”", 0],
      ["“Category managers now see yesterday’s sales before their 9 a.m. pricing call, so price changes go out the same day. Suresh in South zone can confirm.”", 3]
    ] },
  { area: 0, isCase: false,
    q: "The last time you asked for people, money or time, what did your request lead with?",
    opts: [
      ["A number the approver is measured on, what the change would do to it, and what it would cost.", 3],
      ["A full case: the benefits, what other companies do, and a detailed plan.", 2],
      ["The risk to my team if we did not get it: overload, attrition, quality.", 1],
      ["The technical or operational need, explained as clearly as I could.", 0]
    ] },
  { area: 1, isCase: true,
    q: "Your team has trialed two testing tools for six weeks. They are close. Your manager asks where it stands. What do you say?",
    why: "A recommendation with a confidence number and a way back is easier to act on than false certainty or more analysis.",
    opts: [
      ["“Tool A scores slightly higher on our criteria, so we are going with A.”", 2],
      ["“We are running one more round of trials to be sure. I will have an answer in two weeks.”", 0],
      ["“I recommend Tool A. I am about 65 percent sure, because their support team was better. If their support lead leaves, I would switch, and switching costs us three weeks.”", 3],
      ["“Both are strong. I have attached a comparison across fourteen criteria so you can see the detail.”", 1]
    ] },
  { area: 1, isCase: false,
    q: "Your team had more requests than it could handle this quarter. What did you actually do?",
    opts: [
      ["Marked some items as stretch or “subject to capacity”.", 2],
      ["Told specific people, by name, what we would not do this period and what that would cost them.", 3],
      ["Took all of it on and asked the team to stretch.", 0],
      ["Ranked everything and shared the priority list.", 1]
    ] },
  { area: 2, isCase: true,
    q: "You have written a six-page paper asking for ₹40 lakh to replace an old system. A committee of seven receives it the night before. How does page one begin?",
    why: "The committee learns the decision in the first ten seconds, with the condition that could change it right beside it.",
    opts: [
      ["With an executive summary: background, options, risks and next steps.", 1],
      ["With the request: ₹40 lakh, the option you recommend, and the one fact that could change it.", 3],
      ["With the history of the system and why it has become a problem.", 0],
      ["With the three options side by side, so the committee can choose.", 2]
    ] },
  { area: 2, isCase: false,
    q: "What is your manager most worried about this quarter, in their own job?",
    opts: [
      ["I asked, I know, and my last update spoke to it directly.", 3],
      ["I can make a good guess from what they keep asking me about.", 2],
      ["I am not sure.", 0],
      ["I know their goals for the year.", 1]
    ] },
  { area: 3, isCase: true,
    q: "You need two analysts from another team for six weeks. Their manager, your peer, has said no twice. What do you do next?",
    why: "It deals with her worry instead of repeating your need.",
    opts: [
      ["Ask for one analyst for two weeks, as a trial.", 2],
      ["Build a stronger case, with data on the benefit to the company, and present it again.", 0],
      ["Ask what she is worried about, then offer something that removes it, such as returning both analysts before her month-end.", 3],
      ["Ask your director to raise it with her director.", 1]
    ] },
  { area: 3, isCase: false,
    q: "The last time a senior person presented a plan and you thought part of it would fail, what did you do?",
    opts: [
      ["Said “I have some concerns about the timeline” in the meeting.", 2],
      ["Stayed quiet. It was not my call.", 0],
      ["Said nothing in the meeting and sent a detailed note that evening.", 1],
      ["Named the specific part in the meeting, said what I was assuming, and asked what would prove me wrong.", 3]
    ] },
  { area: 4, isCase: true,
    q: "An analyst on your team will present to a client board for the first time on Thursday. She knows the numbers better than you do. What do you do?",
    why: "She keeps ownership of the work, and you prepare her for the room.",
    opts: [
      ["Let her run it alone. She has to learn sometime.", 2],
      ["On Tuesday, test her main point and her two key numbers, rehearse the chair’s usual questions, then let her build the deck and run the meeting.", 3],
      ["Present it yourself this once, and have her watch how it is done.", 0],
      ["Ask for her deck on Wednesday, tighten it yourself, and take the first few questions.", 1]
    ] },
  { area: 4, isCase: false, skip: "I have not used AI at work",
    q: "Think of the last AI draft you used in something a senior person read. What could you say about it?",
    opts: [
      ["I can name which claims I traced to a source, who checked the rest, and which parts are my own judgment.", 3],
      ["I checked the numbers that looked surprising.", 2],
      ["I rewrote most of it in my own words before sending.", 1],
      ["It read well and matched what I know, so I sent it.", 0]
    ] },
  { area: 5, isCase: true,
    q: "Three things went wrong on your team this quarter: a late vendor delivery, a data fix that had to be redone, and an unpatched server. All three are closed. What goes in your quarterly note?",
    why: "It finds the shared cause, counts how far it goes, and leaves the fix with the person who owns it.",
    opts: [
      ["All three are closed, with the root cause and the fix for each.", 1],
      ["All three began with a purchase that skipped review. I counted eleven such purchases this year and gave the list to finance, who own that rule.", 3],
      ["All three are closed. No repeats since.", 0],
      ["All three began with a purchase that skipped review. I propose my team reviews every new purchase from now on.", 2]
    ] },
  { area: 5, isCase: false,
    q: "If you asked for a bigger role tomorrow, what would you bring?",
    opts: [
      ["Strong feedback from my team and from my manager.", 2],
      ["My years in the role and my ratings.", 0],
      ["A list of everything I delivered in the last two years, with numbers.", 1],
      ["Two or three things I already do beyond my role, each confirmed by someone outside my team, and the exact scope I want.", 3]
    ] }
];

var EXITQ = [
  { name: "Where raises go", q: "Think of your last raise. Where did most of it go within six months?",
    tryIt: "On your next salary day, move a fixed share of the raise out before you can spend it. Pick the share today.",
    opts: [["Into a bigger fixed cost: a new EMI, a higher rent, a car.", 0], ["It got absorbed. I cannot say where.", 1], ["Some of it reached savings, when something was left at month end.", 2], ["A set share moved to savings on salary day, before I could spend it.", 3]] },
  { name: "Costs you cannot stop", q: "How much of your take-home pay goes to costs you cannot stop next month, such as EMIs, rent and school fees?",
    tryIt: "Add up every cost you could not stop next month and divide by your take-home pay. Write the percent down.",
    opts: [["More than 70 percent, or I do not know.", 0], ["About 50 to 70 percent.", 1], ["About 30 to 50 percent.", 2], ["Under 30 percent.", 3]] },
  { name: "Riding on one employer", q: "If your employer had a bad year, with the bonus cut and the share price halved, how much of what your household owns and earns would be hit?",
    tryIt: "List salary, bonus and company stock on one page, with a rupee figure for each. See how much of your household rests on one name.",
    opts: [["Most of it. Salary, bonus and stock all come from one company.", 0], ["A lot. Company stock and the bonus are a big part of what we have.", 1], ["Some. The salary would hold and the rest is small.", 2], ["Little. Apart from my salary, almost nothing we own depends on my employer.", 3]] },
  { name: "People you could call", q: "If your job ended on Friday, how many people outside your company could you call on Monday who might pay for your work?",
    tryIt: "Write three names. Message one of them this week about their work, not yours.",
    opts: [["Nobody comes to mind.", 0], ["One or two, but we have not spoken in over a year.", 1], ["A few, though they know my title more than my work.", 2], ["Three or more, and I spoke to at least one of them this quarter.", 3]] },
  { name: "The talk at home", q: "Does the other adult in your household know how many months you could manage without your salary?", skip: "It is only me",
    tryIt: "Bring one number to dinner: your runway in months. Then ask what the two of you would cut first.",
    opts: [["We have never worked it out.", 0], ["I know roughly. We have not talked about it.", 1], ["We both know the number.", 2], ["We both know it, and we have agreed what we would cut first.", 3]] },
  { name: "Big purchases", q: "Think of your last big purchase, such as a car, a holiday or a home upgrade. How did you decide?",
    tryIt: "Before your next big purchase, work out your runway with it and without it. The gap is its price in months.",
    opts: [["It felt affordable on my salary.", 0], ["I checked the EMI against my monthly pay.", 1], ["I checked what it would do to our savings.", 2], ["I worked out how many months of runway it would cost.", 3]] }
];
function runwayPoints(m) { return m < 3 ? 0 : m < 6 ? 1 : m < 12 ? 2 : m < 24 ? 4 : 6; }

var BANDS = [
  { max: 17, name: "Strong at the job you have",
    text: "You do the things that earned you this role, and you do them well. The trouble is that those habits are assumed by the time your name reaches a promotion discussion. I have sat in those rooms. Nobody argues about who worked hardest. They ask whether you can explain what your work changed, make a call without all the facts, and get things done through people you do not manage. Your two weakest areas are the place to begin." },
  { max: 27, name: "One foot on the next step",
    text: "Some of your habits already belong to the next role. The people above you see them now and then, which is why your feedback sounds like “nearly there” or “be more strategic” without any detail. What is missing is consistency. A senior reader who sees the stronger version of you once a quarter will remember the weaker version they see every week." },
  { max: 36, name: "Already working a level up",
    text: "On your own account, you are doing most of the next job already. If the title has not followed, skill is probably not the gap. Either the evidence has not reached the people who decide, or there is no role to give. Those are different problems with different answers, and the last question is where to look first. One caution: people score themselves kindly, and in the six cases it is easier to spot the right answer than to do it on a Tuesday afternoon. Ask a peer or your manager to answer these twelve about you and compare." }
];

/* Pure scoring functions */
function totalOf(scores) { return scores.reduce(function (a, b) { return a + b; }, 0); }
function areaScores(scores) {
  var out = [0, 0, 0, 0, 0, 0];
  QUESTIONS.forEach(function (q, i) { out[q.area] += scores[i]; });
  return out;
}
function weakestTwo(areas) {
  return areas.map(function (s, i) { return { i: i, s: s }; })
    .sort(function (a, b) { return a.s - b.s || a.i - b.i; })
    .slice(0, 2).map(function (x) { return x.i; }).sort();
}
function bandOf(total) { for (var i = 0; i < BANDS.length; i++) { if (total <= BANDS[i].max) return BANDS[i]; } return BANDS[BANDS.length - 1]; }

/* State */
var state = { screen: "intro", idx: 0, scores: [], picked: [], order: [], full: false, edition: null, months: null, covered: false, xi: 0, xs: [], xp: [], xo: [] };
function shuffle(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
function reset() {
  state = { screen: "intro", idx: 0, scores: [], picked: [], order: QUESTIONS.map(function (q) { return shuffle(q.opts.length); }), full: false, edition: null, months: null, covered: false, xi: 0, xs: [], xp: [], xo: EXITQ.map(function (q) { return shuffle(q.opts.length); }) };
}

/* Rendering helpers */
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === "text") n.textContent = attrs[k];
    else if (k === "onclick") n.addEventListener("click", attrs[k]);
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}
var app = document.getElementById("app");
function show(nodes) { app.replaceChildren.apply(app, nodes.filter(Boolean)); window.scrollTo(0, 0); }

function renderIntro() {
  show([
    el("div", { class: "stack" }, [
      el("h2", { style: "font-size:clamp(30px,5vw,40px)", text: "The Optional Career Check" }),
      el("p", { text: "Two scores in about eight minutes. For managers who want to get past the ceiling, and to turn their raises into choices." }),
      el("p", { class: "lead", text: "Twelve questions on how you work, six on your money." }),
      el("p", { text: "Part one is twelve questions about how you work. It gives your Earning Power score. Part two is six questions about your money habits and two amounts. It gives your Exit Power score and your runway in months." }),
      el("p", { class: "muted", text: "Six questions ask what you did last time. Answer for what happened, not what you would like to have done. Six are short cases. Pick what you would send or say." })
    ]),
    el("button", { class: "btn", id: "start", text: "Start the check", onclick: function () { state.screen = "tenure"; render(); } }),
    el("p", { class: "small muted", text: "This is a check on habits, not a measure of ability. Nobody sees your answers but you." })
  ]);
}

var DEMO = "";
var EDITIONS = {
  "new": { tag: "The course", name: "The Optional Career course", text: "One path in eight weeks. The first four, on the skills that help you earn more, are open now.", offer: true },
  "exp": { tag: "The course", name: "The Optional Career course", text: "One path in eight weeks. With 12 or more years behind you, the weeks on depending less will matter most.", offer: true },

function renderTenure() {

}
var LEVEL_CUT = 22, EXIT_CUT = 13, EXIT_CUT_NO_RUNWAY = 10;
var QUADS = {
  te: { name: "Trapped Earner", text: "Your work habits point to the next level, and your Exit Power is low. You are worth more than you can afford to act on. A hard conversation with your boss still carries a risk to your home. Exit Power is the score to move first." },
  oc: { name: "Optional Career", text: "Both numbers are working for you. You can push for the bigger role, say no to a bad one, or slow down, and you can afford each of them. What is left is deciding which one you want." },
  ex: { name: "Exposed on both sides", text: "Your work habits fit the job you have, and your Exit Power is low. That leaves you depending on one employer staying happy with you. Start with your two weakest skill areas, and with the one money habit marked below." },
  sf: { name: "Safe, and standing still", text: "Your Exit Power is solid, so nothing is urgent. Your Earning Power score says the next role is not close yet. You can practise your two weakest areas without fear, which most people cannot." }

function quadOf(total, exit, has) { var hi = total >= LEVEL_CUT, long = exit >= (has ? EXIT_CUT : EXIT_CUT_NO_RUNWAY); return hi ? (long ? "oc" : "te") : (long ? "sf" : "ex"); }
function parseAmt(v) { v = v.replace(/[\u20b9,\s]/g, ""); if (v === "") return null; if (!/^\d+(\.\d+)?$/.test(v)) return NaN; return Number(v); }

function renderRunway() {

      el("label", {}, [document.createTextNode("First name"), el("input", { name: "name", required: "required", maxlength: "100", autocomplete: "given-name", placeholder: "Your first name" })]),
      el("label", {}, [document.createTextNode("Email address"), el("input", { name: "email", type: "email", required: "required", maxlength: "254", autocomplete: "email", placeholder: "you@example.com" })])
    ]),
    el("label", { class: "small muted" }, [el("input", { type: "checkbox", name: "newsletter-consent", value: "yes" }), document.createTextNode(" Also send me The Optional Career, the weekly letter. I can unsubscribe anytime.")]),
    el("button", { class: "btn", type: "submit", text: "Email my result" }),

          el("div", { class: "num", text: state.xs[i] + "/3" })
        ]);

function renderKey() {
